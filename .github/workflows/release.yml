name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
          - name: macOS Apple Silicon
            os: macos-15
            args: --mac --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag and package version differ')"

      - name: Test
        run: npm test

      - name: Build desktop package
        run: npm run desktop:dist -- --publish never ${{ matrix.args }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: convlens-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify all platform packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "release/ConvLens-${version}-Setup-x64.exe"
          test -s "release/ConvLens-${version}-Portable-x64.exe"
          test -s "release/ConvLens-${version}-mac-x64.dmg"
          test -s "release/ConvLens-${version}-mac-x64.zip"
          test -s "release/ConvLens-${version}-mac-arm64.dmg"
          test -s "release/ConvLens-${version}-mac-arm64.zip"
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
